<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bhupendra Dewangan | AI Engineer • Agentic Workflows & Production RAG</title>
  <meta name="description" content="Portfolio of Bhupendra Dewangan - AI Engineer and IIT Madras Data Science Senior specializing in Agentic AI pipelines, autonomous multi-agent systems (LangGraph, MCP), and production RAG architectures." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       CSS VARIABLES & THEMES
       ========================================================================== */
    :root {
      --primary: #6366f1;
      --primary-light: #818cf8;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-violet: #8b5cf6;
      
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
    }

    [data-theme="dark"] {
      --bg-body: #07090e;
      --bg-surface: rgba(15, 23, 42, 0.65);
      --bg-surface-elevated: rgba(30, 41, 59, 0.7);
      --bg-card: rgba(17, 24, 39, 0.75);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --card-glow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      --nav-bg: rgba(7, 9, 14, 0.85);
    }

    [data-theme="light"] {
      --bg-body: #f8fafc;
      --bg-surface: rgba(255, 255, 255, 0.85);
      --bg-surface-elevated: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.9);
      --border-subtle: rgba(0, 0, 0, 0.08);
      --border-focus: rgba(99, 102, 241, 0.6);
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
      --card-glow: 0 10px 25px -5px rgba(99, 102, 241, 0.08);
      --nav-bg: rgba(248, 250, 252, 0.85);
    }

    /* ==========================================================================
       RESET & BASE STYLES
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      transition: background-color var(--transition-smooth), color var(--transition-smooth);
      position: relative;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul {
      list-style: none;
    }

    img, svg {
      vertical-align: middle;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin-inline: auto;
      padding-inline: 1.5rem;
    }

    /* Scroll progress bar */
    #scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--primary), var(--accent-emerald));
      width: 0%;
      z-index: 1000;
      transition: width 0.1s linear;
    }

    /* Background dynamic grid pattern */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(var(--border-subtle) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: -2;
      opacity: 0.6;
    }

    /* ==========================================================================
       NAVIGATION
       ========================================================================== */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 900;
      transition: all var(--transition-fast);
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
    }

    .logo {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-bracket {
      color: var(--primary);
    }

    .logo-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 10px var(--accent-emerald);
      animation: pulse-dot 2s infinite ease-in-out;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .nav-link {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: color var(--transition-fast);
      position: relative;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text-main);
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--primary);
      transition: width var(--transition-fast);
      border-radius: 2px;
    }

    .nav-link:hover::after, .nav-link.active::after {
      width: 100%;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .theme-toggle-btn {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: all var(--transition-fast);
    }

    .theme-toggle-btn:hover {
      color: var(--text-main);
      border-color: var(--border-focus);
      transform: rotate(15deg);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.65rem 1.4rem;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all var(--transition-smooth);
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent-violet));
      color: #ffffff;
      box-shadow: 0 4px 20px var(--primary-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(99, 102, 241, 0.45);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      backdrop-filter: blur(8px);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.08);
      transform: translateY(-2px);
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
    }

    /* ==========================================================================
       HERO SECTION & PARALLAX CANVAS
       ========================================================================== */
    .hero-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 100px;
      padding-bottom: 60px;
      position: relative;
      overflow: hidden;
    }

    #hero-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .hero-content {
      max-width: 820px;
      z-index: 1;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.35rem 0.9rem;
      border-radius: var(--radius-full);
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      color: var(--primary-light);
      font-size: 0.8rem;
      font-family: var(--font-mono);
      font-weight: 500;
      margin-bottom: 1.5rem;
      animation: fadeInDown 0.8s ease backwards;
    }

    .hero-title {
      font-size: clamp(2.5rem, 5.5vw, 4.2rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 1.2rem;
      animation: fadeInUp 0.8s 0.15s ease backwards;
    }

    .gradient-text {
      background: linear-gradient(135deg, #ffffff 20%, var(--accent-cyan) 60%, var(--primary-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    [data-theme="light"] .gradient-text {
      background: linear-gradient(135deg, #0f172a 20%, var(--primary) 70%, var(--accent-violet) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-tagline {
      font-size: clamp(1.1rem, 2vw, 1.45rem);
      font-weight: 500;
      color: var(--accent-cyan);
      font-family: var(--font-mono);
      margin-bottom: 1.5rem;
      min-height: 2em;
      animation: fadeInUp 0.8s 0.3s ease backwards;
    }

    .hero-description {
      font-size: 1.08rem;
      color: var(--text-muted);
      max-width: 680px;
      margin-bottom: 2.2rem;
      animation: fadeInUp 0.8s 0.45s ease backwards;
    }

    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      margin-bottom: 3.5rem;
      animation: fadeInUp 0.8s 0.6s ease backwards;
    }

    /* Key Metrics Strip */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.25rem;
      margin-top: 1rem;
      animation: fadeInUp 0.8s 0.75s ease backwards;
    }

    .metric-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(12px);
      padding: 1.25rem 1.4rem;
      border-radius: var(--radius-md);
      transition: all var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: linear-gradient(to bottom, var(--primary), var(--accent-cyan));
    }

    .metric-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-focus);
      box-shadow: var(--card-glow);
    }

    .metric-number {
      font-family: var(--font-mono);
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 0.15rem;
    }

    .metric-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 0.25rem;
    }

    /* ==========================================================================
       SECTION COMMON STYLES
       ========================================================================== */
    section {
      padding: 6.5rem 0;
      position: relative;
    }

    .section-header {
      margin-bottom: 3.5rem;
      text-align: center;
      max-width: 680px;
      margin-inline: auto;
    }

    .section-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--primary-light);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.6rem;
      display: block;
    }

    .section-title {
      font-size: clamp(2rem, 3.2vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    .section-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
    }

    /* ==========================================================================
       ABOUT SECTION
       ========================================================================== */
    .about-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.75rem;
      backdrop-filter: blur(16px);
      position: relative;
      box-shadow: var(--card-glow);
    }

    .about-bio {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.8;
    }

    .about-highlights {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-subtle);
    }

    .highlight-item {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }

    .highlight-icon-box {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: rgba(99, 102, 241, 0.12);
      color: var(--primary-light);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .highlight-title {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
      color: var(--text-main);
    }

    .highlight-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* ==========================================================================
       TECHNICAL SKILLS SECTION
       ========================================================================== */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.75rem;
    }

    .skill-category-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.8rem;
      backdrop-filter: blur(12px);
      transition: all var(--transition-smooth);
      position: relative;
    }

    .skill-category-card:hover {
      transform: translateY(-5px);
      border-color: var(--border-focus);
      box-shadow: var(--card-glow);
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .category-icon {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      background: rgba(99, 102, 241, 0.15);
      color: var(--primary);
    }

    .category-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .skills-pill-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    .skill-pill {
      font-size: 0.78rem;
      font-weight: 500;
      font-family: var(--font-mono);
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-full);
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      transition: all var(--transition-fast);
    }

    .skill-pill:hover {
      color: var(--text-main);
      border-color: var(--primary-light);
      background: rgba(99, 102, 241, 0.15);
      transform: scale(1.05);
    }

    /* Proficiency Bar inside category card */
    .proficiency-item {
      margin-top: 1rem;
    }

    .proficiency-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      font-family: var(--font-mono);
      margin-bottom: 0.35rem;
      color: var(--text-muted);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--bg-surface-elevated);
      border-radius: var(--radius-full);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent-cyan));
      border-radius: var(--radius-full);
      width: 0%;
      transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Interactive skill tooltip */
    .custom-tooltip {
      position: fixed;
      pointer-events: none;
      background: #0f172a;
      border: 1px solid var(--border-focus);
      color: #f8fafc;
      padding: 0.4rem 0.75rem;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      border-radius: var(--radius-sm);
      z-index: 10000;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      white-space: nowrap;
    }

    .custom-tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==========================================================================
       PROFESSIONAL EXPERIENCE (TIMELINE)
       ========================================================================== */
    .timeline {
      position: relative;
      max-width: 900px;
      margin-inline: auto;
      padding-left: 2rem;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 10px;
      bottom: 20px;
      width: 2px;
      background: linear-gradient(to bottom, var(--primary), var(--accent-cyan), transparent);
    }

    .timeline-node {
      position: relative;
      margin-bottom: 3.5rem;
    }

    .timeline-dot {
      position: absolute;
      left: -2rem;
      top: 6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--bg-body);
      border: 3px solid var(--primary);
      box-shadow: 0 0 12px var(--primary);
      transition: transform var(--transition-fast);
    }

    .timeline-node:hover .timeline-dot {
      transform: scale(1.3);
      background: var(--accent-cyan);
    }

    .exp-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.2rem;
      backdrop-filter: blur(12px);
      transition: all var(--transition-smooth);
    }

    .exp-card:hover {
      border-color: var(--border-focus);
      box-shadow: var(--card-glow);
      transform: translateX(4px);
    }

    .exp-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .exp-role {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .exp-company {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: var(--primary-light);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }

    .exp-badge-date {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 0.3rem 0.8rem;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      color: var(--text-muted);
    }

    .exp-highlights-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.25rem;
    }

    .exp-highlight-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .exp-highlight-icon {
      color: var(--accent-emerald);
      flex-shrink: 0;
      margin-top: 0.2rem;
    }

    .exp-metric-highlight {
      color: var(--text-main);
      font-weight: 600;
    }

    /* ==========================================================================
       KEY PROJECTS SECTION
       =====================================
